<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Quản lý món ăn</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="layout">
  <div th:replace="~{fragments/layout :: sidebar('menu')}"></div>

  <div class="main">
    <div class="topbar">
      <div>
        <h1>Quản lý thực đơn</h1>
        <div class="sub">Danh sách món ăn của nhà hàng</div>
      </div>
      <div class="topbar-spacer"></div>
      <a class="btn" th:href="@{/manager/menu-items/new}">+ Thêm món</a>
    </div>

    <div class="content">
      <div th:if="${message}" class="msg" th:text="${message}"></div>
      <div th:if="${error}" class="error" th:text="${error}"></div>

      <div class="card">
        <div class="card-head">
          <div><h2>Món ăn</h2><p class="card-sub" th:text="${#lists.size(items)} + ' món trong thực đơn'"></p></div>
          <a class="link" th:href="@{/manager/categories}">Quản lý danh mục</a>
        </div>
        <table>
          <tr>
            <th>Tên món</th><th>Danh mục</th><th>Giá</th><th>Còn bán</th><th>Thao tác</th>
          </tr>
          <tr th:each="item : ${items}" th:style="${!item.available} ? 'opacity:.55'">
            <td><b th:text="${item.name}"></b></td>
            <td th:text="${item.category.name}"></td>
            <td class="money" th:text="${#numbers.formatInteger(item.price, 0, 'POINT')} + 'đ'"></td>
            <td>
              <form class="inline" method="post"
                    th:action="@{/manager/menu-items/{id}/toggle(id=${item.id})}">
                <span class="pill" th:classappend="${item.available} ? 'paid' : 'pending'"
                      th:text="${item.available} ? 'Đang bán' : 'Hết'"></span>
                <button type="submit" class="btn small gray" style="margin-left:6px"
                        th:text="${item.available} ? 'Tắt' : 'Bật'"></button>
              </form>
            </td>
            <td>
              <a class="btn small gray" th:href="@{/manager/menu-items/{id}/edit(id=${item.id})}">Sửa</a>
              <form class="inline" method="post" th:action="@{/manager/menu-items/{id}/delete(id=${item.id})}"
                    onsubmit="return confirm('Xóa món này?')">
                <button type="submit" class="btn small danger">Xóa</button>
              </form>
            </td>
          </tr>
        </table>
      </div>
    </div>
  </div>
</div>
</body>
</html>
