<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Thông tin món ăn</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="layout">
  <div th:replace="~{fragments/layout :: sidebar('menu')}"></div>

  <div class="main">
    <div class="topbar">
      <div>
        <h1 th:text="${form.id == null} ? 'Thêm món mới' : 'Sửa món'">Thêm món</h1>
        <div class="sub">Quản lý thực đơn</div>
      </div>
      <div class="topbar-spacer"></div>
      <a class="link" th:href="@{/manager/menu-items}">← Về danh sách món</a>
    </div>

    <div class="content">
      <div class="card" style="max-width:640px">
        <div th:if="${error}" class="error" th:text="${error}"></div>

        <form method="post" th:action="@{/manager/menu-items/save}" th:object="${form}">
          <input type="hidden" th:field="*{id}">

          <label>Tên món</label>
          <input type="text" th:field="*{name}">

          <label>Danh mục</label>
          <select th:field="*{categoryId}">
            <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}"></option>
          </select>

          <label>Giá (VNĐ)</label>
          <input type="number" th:field="*{price}" min="1">

          <label>Đường dẫn ảnh (không bắt buộc)</label>
          <input type="text" th:field="*{imageUrl}">

          <label style="display:flex;gap:8px;align-items:center">
            <input type="checkbox" th:field="*{available}" style="width:auto"> Còn bán
          </label>

          <div class="actions">
            <button type="submit" class="btn">Lưu</button>
            <a class="btn gray" th:href="@{/manager/menu-items}">Hủy</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
</body>
</html>
