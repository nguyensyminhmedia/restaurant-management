<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Chi tiết hóa đơn</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="layout">
  <div th:replace="~{fragments/layout :: sidebar('cashier')}"></div>

  <div class="main">
    <div class="topbar">
      <div>
        <h1 th:text="'Hóa đơn ' + ${order.code}">Hóa đơn</h1>
        <div class="sub" th:text="${order.table.name} + ' · ' + ${order.customerDisplay}"></div>
      </div>
      <div class="topbar-spacer"></div>
      <a class="btn ghost small" th:href="@{/cashier}">← Về danh sách</a>
    </div>

    <div class="content">
      <div class="card" style="max-width:720px">
        <div class="card-head">
          <div>
            <h2 th:text="'Đơn ' + ${order.code}"></h2>
            <p class="card-sub" th:text="${#temporals.format(order.createdAt, 'HH:mm dd/MM/yyyy')}"></p>
          </div>
          <span class="pill" th:classappend="${order.status.name().toLowerCase()}" th:text="${order.status}"></span>
        </div>

        <p class="hint" th:if="${order.note}" th:text="'Ghi chú: ' + ${order.note}" style="color:var(--amber)"></p>

        <table>
          <tr><th>Món</th><th>Số lượng</th><th>Đơn giá</th><th>Thành tiền</th></tr>
          <tr th:each="i : ${order.items}">
            <td th:text="${i.menuItem.name}"></td>
            <td th:text="${i.quantity}"></td>
            <td th:text="${#numbers.formatInteger(i.price, 0, 'POINT')} + 'đ'"></td>
            <td class="money" th:text="${#numbers.formatInteger(i.subtotal, 0, 'POINT')} + 'đ'"></td>
          </tr>
        </table>

        <div class="total-line" style="display:flex;justify-content:space-between;padding-top:14px;margin-top:8px;border-top:2px solid var(--line);font-size:17px">
          <span>Tổng cộng</span>
          <span class="money" style="color:var(--orange)" th:text="${#numbers.formatInteger(order.total, 0, 'POINT')} + 'đ'"></span>
        </div>

        <div class="actions">
          <form method="post" th:action="@{/cashier/orders/{id}/pay(id=${order.id})}"
                onsubmit="return confirm('Xác nhận đã thu tiền?')">
            <button type="submit" class="btn">Thanh toán</button>
          </form>
          <a class="btn gray" th:href="@{/cashier}">Quay lại</a>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
