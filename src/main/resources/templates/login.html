<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Đăng nhập · Quản lý nhà hàng</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body style="background:var(--navy);display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px">
  <div style="width:100%;max-width:400px">
    <div style="text-align:center;margin-bottom:28px">
      <div style="width:52px;height:52px;border-radius:14px;background:var(--orange);display:flex;align-items:center;justify-content:center;font-size:26px;margin:0 auto 14px">🍽️</div>
      <h1 style="color:#fff;font-size:22px;margin:0">Quản lý nhà hàng</h1>
      <p style="color:#8b93a8;font-size:13px;margin:6px 0 0">Đăng nhập để tiếp tục công việc</p>
    </div>

    <div class="card" style="padding:28px">
      <div th:if="${param.error}" class="error">Sai tên đăng nhập hoặc mật khẩu.</div>
      <div th:if="${param.logout}" class="msg">Bạn đã đăng xuất.</div>

      <form th:action="@{/login}" method="post">
        <label>Tên đăng nhập</label>
        <input type="text" name="username" required autofocus>
        <label>Mật khẩu</label>
        <input type="password" name="password" required>
        <button type="submit" class="btn" style="width:100%;margin-top:8px">Đăng nhập</button>
      </form>
    </div>

    <p style="text-align:center;color:#6b7385;font-size:12px;margin-top:20px">
      © 2026 Nhà hàng · Hệ thống quản lý nội bộ
    </p>
  </div>
</body>
</html>
