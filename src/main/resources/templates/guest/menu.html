<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thực đơn</title>
  <link rel="stylesheet" th:href="@{/css/guest.css}">
</head>
<body>
<div class="wrap">
  <div class="header">
    <h1>Thực đơn</h1>
    <small th:text="${table.name} + ' · ' + ${table.seats} + ' chỗ'">Bàn</small>
  </div>

  <p class="ok" th:if="${param.sent}" th:text="'Đã gửi món #' + ${param.sent} + ' xuống bếp. Chúc bạn dùng bữa ngon!'">Đã gửi bếp.</p>

  <form class="search" method="get" th:action="@{/t/{id}(id=${table.id})}">
    <input type="hidden" name="categoryId" th:if="${selectedCategoryId != null}"
           th:value="${selectedCategoryId}">
    <input type="text" name="q" th:value="${q}" placeholder="Tìm món...">
    <button type="submit">Tìm</button>
  </form>

  <div class="chips">
    <a class="chip" th:classappend="${selectedCategoryId == null} ? 'active'"
       th:href="@{/t/{id}(id=${table.id}, q=${q})}">Tất cả</a>
    <a class="chip" th:each="c : ${categories}"
       th:classappend="${selectedCategoryId != null and selectedCategoryId == c.id} ? 'active'"
       th:href="@{/t/{id}(id=${table.id}, categoryId=${c.id}, q=${q})}"
       th:text="${c.name}">Danh mục</a>
  </div>

  <div class="item" th:each="item : ${items}">
    <div>
      <div class="name" th:text="${item.name}">Tên món</div>
      <div class="cat" th:text="${item.category.name}">Danh mục</div>
    </div>
    <div class="item-right">
      <div class="price" th:text="${#numbers.formatInteger(item.price, 0, 'POINT')} + 'đ'">0đ</div>
      <form method="post" th:action="@{/t/{id}/cart/add(id=${table.id})}">
        <input type="hidden" name="menuItemId" th:value="${item.id}">
        <button type="submit" class="add">+</button>
      </form>
    </div>
  </div>

  <p class="empty" th:if="${#lists.isEmpty(items)}">Không có món nào phù hợp.</p>
</div>

<div class="cart-bar" th:if="${cartCount > 0}">
  <a class="cart-bar-link" th:href="@{/t/{id}/cart(id=${table.id})}">
    <span class="badge" th:text="${cartCount}">0</span>
    <span>Xem giỏ</span>
    <b th:text="${#numbers.formatInteger(cartTotal, 0, 'POINT')} + 'đ'">0đ</b>
  </a>
</div>
</body>
</html>
